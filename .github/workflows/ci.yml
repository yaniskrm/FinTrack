name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint + Typecheck ───────────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read automatically from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo builds @fintrack/core (dependsOn "^build") before typechecking the
      # web app — otherwise its dist/ is missing and web sees `Cannot find module
      # '@fintrack/core'`. Scoped to core + web (mobile lint is pre-existing debt).
      - name: Lint & Typecheck
        run: pnpm turbo lint typecheck --filter=@fintrack/core --filter=@fintrack/web

  # ─── Unit tests (packages/core) ────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm --filter @fintrack/core test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: packages/core/coverage
          flags: unit
        continue-on-error: true

  # ─── Build (apps/web) ───────────────────────────────────────
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo builds @fintrack/core first (dependsOn "^build"), then the web app.
      - name: Build
        run: pnpm turbo build --filter=@fintrack/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # ─── Integration tests (Supabase local) ────────────────────
  # Activated in Phase 3+ when integration tests exist.
  # Requires self-hosted runner with Docker, or GitHub's larger runners.
  # integration-tests:
  #   name: Integration tests
  #   runs-on: ubuntu-latest
  #   if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: pnpm
  #     - uses: supabase/setup-cli@v1
  #       with:
  #         version: latest
  #     - run: pnpm install --frozen-lockfile
  #     - run: supabase start
  #     - run: supabase db reset
  #     - run: pnpm --filter @fintrack/core test
  #     - if: always()
  #       run: supabase stop

  # ─── E2E (Playwright, against Supabase local + a production build) ────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, build-web]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @fintrack/web exec playwright install --with-deps chromium webkit

      # Pinned, not "latest": CI was hitting "Espace introuvable." (no
      # workspace found) on the very first request after signup — the
      # on_auth_user_created trigger (AFTER INSERT ON auth.users, creates the
      # workspace/workspace_member synchronously in the same transaction)
      # appears not to have run yet by the time the client's next request
      # lands, only reproducing against the CLI's newer default stack, never
      # locally against 2.75.0 (extensively retested, including from-scratch
      # `db reset`s). Pin to the version this workflow is actually verified
      # against; bump deliberately, not implicitly on every run.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Start Supabase local (applies migrations + seed)
        run: supabase start

      # `start` alone can leave PostgREST serving a schema cache from just
      # before the last migration finished applying (spurious 403s on tables
      # gated by a RESTRICTIVE policy added in a late migration) — `db reset`
      # forces a full re-apply + container restart, guaranteeing PostgREST
      # boots against the final schema. Cheap and reliable on a fresh DB.
      - name: Reset Supabase local (forces a clean PostgREST schema cache)
        run: supabase db reset

      # `supabase status -o env` prints shell-quoted `KEY="value"` lines (meant
      # for sourcing) — GITHUB_ENV needs bare `KEY=value`, so the surrounding
      # quotes must be stripped too, not just the key renamed.
      - name: Export Supabase local env into GITHUB_ENV
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed \
            -e 's/^API_URL="\(.*\)"$/NEXT_PUBLIC_SUPABASE_URL=\1/' \
            -e 's/^ANON_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_ANON_KEY=\1/' \
            >> "$GITHUB_ENV"
          # Public half of a throwaway local-only VAPID pair (not a secret —
          # "public" is the point) so the notifications settings page renders
          # its "off" state (with the enable button) instead of "unconfigured"
          # for the a11y/notifications E2E specs.
          echo 'NEXT_PUBLIC_VAPID_PUBLIC_KEY=BIEAsae-LfktAEprjNLXWwMZH02wq9lsm6MZNhqeqv_OMS-NLBtXK3s2H5zt-iUAk2s5BHh302z-5Y5w8yNGMks' >> "$GITHUB_ENV"

      # Turbo builds @fintrack/core first (dependsOn "^build"), then the web
      # app — this time against the real local Supabase, not the placeholder
      # used by the build-web job (which only checks the build succeeds).
      - name: Build web against Supabase local
        run: pnpm turbo build --filter=@fintrack/web

      - name: Run Playwright tests
        run: pnpm --filter @fintrack/web exec playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - if: always()
        run: supabase stop
